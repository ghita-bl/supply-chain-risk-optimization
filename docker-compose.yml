services:
  postgres:
    image: postgres:16
    container_name: supply-chain-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supply_chain_case
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - supply_chain_pgdata:/var/lib/postgresql/data

volumes:
  supply_chain_pgdata: